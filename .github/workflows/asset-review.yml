name: Asset visual review

on:
  push:
    branches: ["fix/p0-p1-assets-20260915"]
  pull_request:
    paths: ["source/**", ".github/workflows/asset-review.yml"]

permissions:
  contents: read

concurrency:
  group: asset-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install and build
        working-directory: source
        run: npm ci && npm run build
      - name: Package review workspace
        run: |
          tar --exclude=.git --exclude=review-workspace.tgz -czf /tmp/review-workspace.tgz .
          mkdir -p review-artifact
          mv /tmp/review-workspace.tgz review-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: winbrain-review-workspace
          path: review-artifact/review-workspace.tgz
          retention-days: 3
