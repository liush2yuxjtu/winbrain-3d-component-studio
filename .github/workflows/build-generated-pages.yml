name: Build generated Pages artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/**"

permissions:
  contents: write

concurrency:
  group: winbrain-generated-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install build dependencies
        working-directory: source
        run: npm ci

      - name: Build homepage, studio, catalog, tokens and motion
        working-directory: source
        run: npm run build

      - name: Commit generated artifacts
        run: |
          GENERATED=(index.html studio.html catalog.html tokens.html tokens.css motion.html motion-manifest.json)
          if [ -z "$(git status --porcelain -- "${GENERATED[@]}")" ]; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${GENERATED[@]}"
          git commit -m "Build generated Pages artifacts"
          git push
